<header class="site-header">
  <div class="container header-inner">
    <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.name | escape }}</a>
    <nav class="site-nav" aria-label="Primary navigation">
      <ul class="nav-list">
        {% for item in site.data.navigation %}
          <li>
            <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>
              {{ item.title | escape }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </nav>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme">
      Use dark theme
    </button>
  </div>
</header>
